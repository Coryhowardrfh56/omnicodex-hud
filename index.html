<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sovereign Omnicodex</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --panel: #131824; --panel2: #1a2130; --line: #263145;
    --text: #dfe6f1; --dim: #8896ad; --accent: #6ea8ff; --good: #55d187;
    --warn: #e2b341; --bad: #e26d6d; --purple: #b98cff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .meter { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: right; }
  header .meter b { color: var(--good); }
  header .clear { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px; }

  .scroll { flex: 1; overflow-y: auto; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 18px 24px 24px; }

  /* live strip */
  .striptop { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .striptop h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin: 0; font-weight: 600; }
  .refresh { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; }
  .refresh:hover { color: var(--accent); }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px,1fr)); gap: 10px; margin-bottom: 20px; }
  .feed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .feed h3 { margin: 0 0 7px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .feed .pt { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; padding: 2px 0; }
  .feed .pt b { color: var(--text); font-weight: 600; }
  .feed .asof { color: var(--dim); font-size: 10px; margin-top: 6px; font-family: var(--mono); }

  /* conversation */
  .msg { margin: 14px 0; }
  .msg.user .bubble {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 15px; display: inline-block; max-width: 80%; margin-left: auto;
  }
  .msg.user { text-align: right; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 22px 16px; }
  .answer h1 { font-size: 20px; } .answer h2 { font-size: 16px; color: var(--accent); margin-top: 22px; }
  .answer h3 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .answer table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .answer th { background: var(--panel2); }
  .answer code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .answer hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .answer blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 14px; color: var(--dim); }

  .lbl { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .lbl.v { background: rgba(85,209,135,.15); color: var(--good); }
  .lbl.i { background: rgba(110,168,255,.15); color: var(--accent); }
  .lbl.u { background: rgba(185,140,255,.15); color: var(--purple); }
  .lbl.m { background: rgba(226,179,65,.15); color: var(--warn); }

  .meta { margin: 10px 0 2px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .badge { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel2); }
  .badge.dom { color: var(--accent); border-color: var(--accent); }
  .chip { font-family: var(--mono); font-size: 10px; color: var(--dim); background: var(--panel2); border-radius: 5px; padding: 2px 7px; }
  .cost { color: var(--good); }
  .spinner { color: var(--dim); padding: 8px 0; font-family: var(--mono); }
  .err { color: var(--bad); font-family: var(--mono); font-size: 13px; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
  .ex { background: var(--panel); border: 1px solid var(--line); color: var(--dim); border-radius: 16px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .ex:hover { color: var(--text); border-color: var(--accent); }

  /* composer */
  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 24px; flex-shrink: 0; }
  .composer .inner { max-width: 1040px; margin: 0 auto; }
  textarea {
    width: 100%; min-height: 52px; resize: vertical; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .tier { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
  .tier button { background: none; border: none; color: var(--dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .tier button.on { background: var(--panel2); color: var(--text); }
  .tier button.opus.on { color: var(--warn); }
  .hint { color: var(--dim); font-size: 12px; }
  .go { margin-left: auto; background: var(--accent); color: #06101f; border: none; border-radius: 8px; padding: 9px 22px; font-weight: 600; cursor: pointer; font: inherit; }
  .go:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>⌘ SOVEREIGN OMNICODEX</h1>
  <span class="sub">Prometheus · Chronos · Icarus · Methuselah · Hermes</span>
  <div class="meter">
    <span id="meter">0 questions · $0.0000 this session</span>
    <button class="clear" onclick="clearSession()">clear</button>
  </div>
</header>

<div class="scroll">
  <div class="wrap">
    <div class="striptop">
      <h2>Live data</h2>
      <button class="refresh" onclick="loadFeeds()" title="refresh feeds">↻</button>
    </div>
    <div class="strip" id="strip"><div class="feed"><h3>Live data</h3><div class="asof">loading…</div></div></div>

    <div class="examples" id="examples">
      <button class="ex" onclick="fill(this)">What do current yields and the dollar mean for BTC?</button>
      <button class="ex" onclick="fill(this)">How does Monero strengthen my macro thesis?</button>
      <button class="ex" onclick="fill(this)">Give me a snapshot of the system</button>
      <button class="ex" onclick="fill(this)">What did rising long yields do before past recessions?</button>
    </div>

    <div id="thread"></div>
  </div>
</div>

<div class="composer">
  <div class="inner">
    <textarea id="q" placeholder="Ask the Omnicodex…  (⌘/Ctrl+Enter to send)"></textarea>
    <div class="row">
      <div class="tier">
        <button id="t-haiku" class="on" onclick="setTier('ROUTER')">Fast · Haiku</button>
        <button id="t-opus" class="opus" onclick="setTier('SPECIALIST')">Deep · Opus ($)</button>
      </div>
      <span class="hint" id="tierhint">Fast mode ≈ $0.01 / question</span>
      <button class="go" id="go" onclick="ask()">Ask →</button>
    </div>
  </div>
</div>

<script>
  const ENDPOINT = "https://hvstpthdxzfxcilyqyfo.supabase.co/functions/v1/omnicodex-brain";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2c3RwdGhkeHpmeGNpbHlxeWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTEyNzcsImV4cCI6MjEwMjYyNzI3N30.CsmryXwxpkJur9Gbc8xcUr6F2X2e7rcaDhAWCupHfsE"; // publishable Supabase anon key (RLS-protected)
  const HISTORY_TURNS = 6; // how many prior messages to send as context

  let tier = "ROUTER";
  let messages = [];              // {role, text} — raw, for history + render
  let session = { count: 0, cost: 0 };

  // ---- persistence ----
  function save() {
    localStorage.setItem("omni_thread", JSON.stringify(messages));
    localStorage.setItem("omni_session", JSON.stringify(session));
  }
  function restore() {
    try { messages = JSON.parse(localStorage.getItem("omni_thread") || "[]"); } catch { messages = []; }
    try { session = JSON.parse(localStorage.getItem("omni_session") || '{"count":0,"cost":0}'); } catch {}
    renderThread(); renderMeter();
  }
  function clearSession() {
    messages = []; session = { count: 0, cost: 0 };
    save(); renderThread(); renderMeter();
  }

  function renderMeter() {
    document.getElementById("meter").textContent =
      `${session.count} question${session.count === 1 ? "" : "s"} · $${session.cost.toFixed(4)} this session`;
  }

  // color-code the four claim labels so evidence discipline is visible
  function highlight(html) {
    const map = [
      [/\bVERIFIED\b/g, "v"], [/\bINFERENCE\b/g, "i"],
      [/\bUSER[ _]THESIS\b/g, "u"], [/\bMODEL[ _]PROBABILITY\b/g, "m"],
    ];
    for (const [re, cls] of map) html = html.replace(re, (m) => `<span class="lbl ${cls}">${m}</span>`);
    return html;
  }

  function renderThread() {
    const t = document.getElementById("thread");
    t.innerHTML = messages.map((m) => {
      if (m.role === "user") return `<div class="msg user"><div class="bubble">${escapeHtml(m.text)}</div></div>`;
      return `<div class="msg"><div class="answer">${highlight(marked.parse(m.text))}</div>${m.metaHtml || ""}</div>`;
    }).join("");
    document.getElementById("examples").style.display = messages.length ? "none" : "flex";
  }
  function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  function setTier(t) {
    tier = t;
    document.getElementById("t-haiku").classList.toggle("on", t === "ROUTER");
    document.getElementById("t-opus").classList.toggle("on", t === "SPECIALIST");
    document.getElementById("tierhint").textContent =
      t === "ROUTER" ? "Fast mode ≈ $0.01 / question" : "Deep mode ≈ $0.50–0.70 / question";
  }
  function fill(el) { document.getElementById("q").value = el.textContent; document.getElementById("q").focus(); }

  async function post(body) {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + ANON },
      body: JSON.stringify(body),
    });
    return r.json();
  }

  function fmt(p) {
    const v = p.unit === "%" ? p.value + "%" : p.value.toLocaleString() + " " + p.unit;
    return `<div class="pt"><span>${p.label}</span><b>${v}</b></div>`;
  }
  async function loadFeeds() {
    try {
      const d = await post({ feedsOnly: true });
      document.getElementById("strip").innerHTML = (d.feeds || []).map(f =>
        `<div class="feed"><h3>${f.title}</h3>${f.points.map(fmt).join("")}` +
        `<div class="asof">as of ${(f.points[0]?.asOf || "").slice(0, 10)} · ${f.source}</div></div>`
      ).join("") || '<div class="feed"><h3>Live data</h3><div class="asof">no feeds</div></div>';
    } catch {
      document.getElementById("strip").innerHTML = '<div class="feed"><h3>Live data</h3><div class="err">feed load failed</div></div>';
    }
  }

  function metaBar(d) {
    const sel = d.selection || {}, u = d.usage || {};
    const chips = (sel.protocols || []).map(p => `<span class="chip">${p}</span>`).join(" ");
    return `<div class="meta">` +
      `<span class="badge dom">${d.routing?.domain || "?"}</span>` +
      `<span class="badge">${d.tier} · ${d.model || ""}</span>` +
      (sel.questionTypes?.length ? `<span class="badge">${sel.questionTypes.join(", ")}</span>` : "") +
      `<span class="badge cost">$${(u.estimatedCostUsd ?? 0).toFixed(4)} · ${u.inputTokens || 0}in/${u.outputTokens || 0}out</span>` +
      (chips ? `<div style="flex-basis:100%;margin-top:5px">${chips}</div>` : "") +
      `</div>`;
  }

  async function ask() {
    const el = document.getElementById("q");
    const q = el.value.trim();
    if (!q) return;
    const go = document.getElementById("go");
    go.disabled = true; el.value = "";

    messages.push({ role: "user", text: q });
    const thinkId = "think" + Date.now();
    renderThread();
    document.getElementById("thread").insertAdjacentHTML("beforeend",
      `<div class="msg" id="${thinkId}"><div class="spinner">◍ ${tier === "SPECIALIST" ? "deep analysis" : "thinking"}…</div></div>`);
    scrollDown();

    // prior turns as context (exclude the message we're about to send)
    const history = messages.slice(0, -1).slice(-HISTORY_TURNS).map(m => ({ role: m.role, content: m.text }));
    try {
      const d = await post({ message: q, tier, history });
      document.getElementById(thinkId)?.remove();
      if (d.error) {
        messages.push({ role: "assistant", text: "**Error:** " + d.error });
      } else {
        session.count++; session.cost += d.usage?.estimatedCostUsd || 0;
        messages.push({ role: "assistant", text: d.answer || "(empty)", metaHtml: metaBar(d) });
        loadFeeds();
      }
      renderThread(); renderMeter(); save(); scrollDown();
    } catch (e) {
      document.getElementById(thinkId)?.remove();
      messages.push({ role: "assistant", text: "**Error:** " + e });
      renderThread(); save();
    } finally {
      go.disabled = false;
    }
  }

  function scrollDown() {
    const s = document.querySelector(".scroll");
    s.scrollTop = s.scrollHeight;
  }

  document.getElementById("q").addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
  });
  restore();
  loadFeeds();
</script>
</body>
</html>
